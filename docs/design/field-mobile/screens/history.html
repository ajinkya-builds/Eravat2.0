<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Territory history — Eravat UI</title>
  <link rel="stylesheet" href="../../tokens.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone-meta">
      <a href="../../index.html">← Gallery</a>
      <span class="title">Field · History</span>
    </div>
    <div class="phone">
      <div class="phone-screen bg-app">
        <div class="phone-notch"></div>
        <header class="field-top">
          <button class="btn-icon">‹</button>
          <div style="flex:1"><div style="font-weight:800">Territory history</div></div>
        </header>
        <div class="field-scroll" style="padding-bottom:calc(var(--safe-bottom)+1rem)">
          <div class="constraint">Remote + local Dexie merge · expand · share</div>
          <div class="glass-card" style="overflow:hidden">
            <div class="list-card">
              <div class="row-top">
                <div class="title">Direct</div>
                <span class="badge badge-info">Territory</span>
              </div>
              <div class="meta">04 Oct 06:42 · Amboli · Sawantwadi</div>
            </div>
            <div class="list-card">
              <div class="row-top">
                <div class="title">Loss · Crop</div>
                <span class="badge badge-danger">Proximity</span>
              </div>
              <div class="meta">03 Oct 18:02 · within radius</div>
            </div>
            <div class="list-card">
              <div class="row-top">
                <div class="title">Indirect</div>
                <span class="badge badge-muted">Local queue</span>
              </div>
              <div class="meta">Pending sync · device only</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="note">Same data sources and share/download; cards easier to scan.</p>
  </div>
</body>
</html>

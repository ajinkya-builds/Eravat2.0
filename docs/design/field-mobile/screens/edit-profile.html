<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Edit profile — Eravat UI</title>
  <link rel="stylesheet" href="../../tokens.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone-meta">
      <a href="../../index.html">← Gallery</a>
      <span class="title">Field · Edit profile</span>
    </div>
    <div class="phone">
      <div class="phone-screen bg-app">
        <div class="phone-notch"></div>
        <header class="field-top">
          <button class="btn-icon">‹</button>
          <div style="flex:1"><div style="font-weight:800">Edit profile</div></div>
        </header>
        <div class="field-scroll" style="padding-bottom:calc(var(--safe-bottom)+5rem)">
          <div class="constraint">Name + GPS · phone locked</div>
          <div class="field-row">
            <div class="field"><label>First name</label><input value="Sagar" /></div>
            <div class="field"><label>Last name</label><input value="Naik" /></div>
          </div>
          <div class="field"><label>Phone</label><input value="+91 98xxx xxxxx" readonly style="opacity:0.7" /></div>
          <button class="btn btn-ghost" style="width:100%;margin-bottom:0.75rem">📍 Update GPS</button>
          <div class="field-row">
            <div class="field"><label>Lat</label><input value="15.96" readonly /></div>
            <div class="field"><label>Lng</label><input value="74.00" readonly /></div>
          </div>
        </div>
        <div class="wizard-footer" style="grid-template-columns:1fr">
          <button class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
    <p class="note">Save → auto-back; same fields.</p>
  </div>
</body>
</html>

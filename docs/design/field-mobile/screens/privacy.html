<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Privacy — Eravat UI</title>
  <link rel="stylesheet" href="../../tokens.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone-meta">
      <a href="../../index.html">← Gallery</a>
      <span class="title">Field · Privacy</span>
    </div>
    <div class="phone">
      <div class="phone-screen bg-app">
        <div class="phone-notch"></div>
        <header class="field-top">
          <button class="btn-icon">‹</button>
          <div style="flex:1"><div style="font-weight:800">Privacy &amp; security</div></div>
        </header>
        <div class="field-scroll" style="padding-bottom:calc(var(--safe-bottom)+1rem)">
          <div class="constraint">Sessions display · analytics toggle</div>
          <div class="glass-card" style="padding:1rem;margin-bottom:0.75rem">
            <div style="font-weight:700;margin-bottom:0.25rem">Active sessions</div>
            <div class="text-muted" style="font-size:0.85rem">1 Device (this phone)</div>
          </div>
          <label class="glass-card" style="padding:1rem;display:flex;justify-content:space-between;align-items:center;gap:0.75rem">
            <div>
              <div style="font-weight:700">Analytics</div>
              <div class="text-muted" style="font-size:0.78rem;margin-top:0.2rem">Help improve Eravat</div>
            </div>
            <input type="checkbox" checked style="width:20px;height:20px" />
          </label>
        </div>
      </div>
    </div>
    <p class="note">Same content; card layout only.</p>
  </div>
</body>
</html>

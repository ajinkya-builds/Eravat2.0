<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Login · OTP — Eravat UI</title>
  <link rel="stylesheet" href="../../tokens.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone-meta">
      <a href="../../index.html">← Gallery</a>
      <span class="title">Auth · Step 2</span>
    </div>
    <div class="phone">
      <div class="phone-screen bg-app">
        <div class="phone-notch"></div>
        <div class="admin-scroll" style="padding-top:calc(var(--safe-top)+0.5rem)">
          <button class="btn btn-ghost" style="align-self:flex-start;margin-bottom:1rem">← Change number</button>
          <div class="constraint">Flow unchanged · verify → home</div>
          <h1 style="margin:0 0 0.35rem;font-size:1.45rem">Enter OTP</h1>
          <p class="text-muted" style="margin:0 0 1.25rem;font-size:0.9rem">Code sent to +91 98765 43210</p>
          <div class="glass-card" style="padding:1.15rem">
            <div class="field">
              <label>6-digit code</label>
              <input type="text" inputmode="numeric" maxlength="6" placeholder="••••••" style="letter-spacing:0.35em;font-size:1.35rem;font-weight:700;text-align:center" />
            </div>
            <button class="btn btn-primary" style="width:100%">Verify &amp; continue</button>
            <button class="btn btn-ghost" style="width:100%;margin-top:0.5rem" disabled>Resend in 0:48</button>
          </div>
        </div>
      </div>
    </div>
    <p class="note">Resend cooldown, back-to-phone, and error states stay; only visual clarity improves.</p>
  </div>
</body>
</html>

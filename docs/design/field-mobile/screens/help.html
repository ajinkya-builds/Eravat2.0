<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Help — Eravat UI</title>
  <link rel="stylesheet" href="../../tokens.css" />
</head>
<body>
  <div class="phone-page">
    <div class="phone-meta">
      <a href="../../index.html">← Gallery</a>
      <span class="title">Field · Help</span>
    </div>
    <div class="phone">
      <div class="phone-screen bg-app">
        <div class="phone-notch"></div>
        <header class="field-top">
          <button class="btn-icon">‹</button>
          <div style="flex:1"><div style="font-weight:800">Help &amp; support</div></div>
        </header>
        <div class="field-scroll" style="padding-bottom:calc(var(--safe-bottom)+1rem)">
          <div class="constraint">Report issue · FAQ · policy · force sync</div>
          <div class="glass-card" style="overflow:hidden;margin-bottom:0.75rem">
            <a class="menu-row" href="#">Report an issue <span class="chev">›</span></a>
            <a class="menu-row" href="#">Call support (TBD) <span class="chev">›</span></a>
            <a class="menu-row" href="#">Email support (TBD) <span class="chev">›</span></a>
            <a class="menu-row" href="faq.html">FAQ <span class="chev">›</span></a>
            <a class="menu-row" href="privacy-policy.html">Privacy policy <span class="chev">›</span></a>
          </div>
          <div class="glass-card" style="padding:1rem;margin-bottom:0.75rem">
            <div class="text-muted" style="font-size:0.75rem">App version</div>
            <div style="font-weight:700">2.1.x · Android</div>
          </div>
          <button class="btn btn-ghost" style="width:100%">Force sync now</button>
        </div>
      </div>
    </div>
    <p class="note">Report issue opens existing FAB dialog; links unchanged.</p>
  </div>
</body>
</html>

appId: com.forestdept.eravat
---
# Smoke through photo → observation type (full submit covered by emulator CDP e2e)
- runFlow:
    file: login-beat-guard.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- tapOn: ".*Add Sighting.*"
- extendedWaitUntil:
    visible: "Use test photo"
    timeout: 20000
- tapOn: "Use test photo"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Continue|Back|Add Sighting"
    timeout: 20000
- tapOn:
    point: "50%,38%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- takeScreenshot: report-observation-selected

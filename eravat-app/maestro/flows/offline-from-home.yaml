appId: com.forestdept.eravat
---
# Assumes already logged in on field home; toggles airplane for offline smoke
- extendedWaitUntil:
    visible: ".*Nearby Sightings.*|.*Add Sighting.*"
    timeout: 20000
- toggleAirplaneMode
- extendedWaitUntil:
    visible: ".*Add Sighting.*|.*Nearby.*|Offline|Online"
    timeout: 20000
- tapOn: ".*Add Sighting.*"
- extendedWaitUntil:
    visible: "Use test photo|Continue|Add Sighting"
    timeout: 25000
- tapOn:
    text: "Use test photo"
    optional: true
- extendedWaitUntil:
    visible: "Continue|Use test photo|Add Sighting"
    timeout: 15000
- takeScreenshot: offline-report-photo
# Exit report before restoring network (bottom nav hidden on /report)
- tapOn:
    text: "Close and go back"
    optional: true
- tapOn:
    text: "Discard & Exit"
    optional: true
- toggleAirplaneMode
- extendedWaitUntil:
    visible: "Online|.*Nearby Sightings.*|.*Add Sighting.*"
    timeout: 20000
    optional: true

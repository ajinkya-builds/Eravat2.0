appId: com.forestdept.eravat
---
# Smoke: open Onboard Villager form from field home
- runFlow:
    file: login-beat-guard.yaml
    env:
      PHONE: ${PHONE}
      OTP: ${OTP}
- extendedWaitUntil:
    visible: "Add Sighting|Home|ERAVAT|Nearby"
    timeout: 25000
- tapOn:
    text: "Onboard Villager"
    optional: true
- tapOn:
    point: "28%,68%"
    optional: true
- extendedWaitUntil:
    visible: "Register|Full name|Name|Village|9876543210|Onboard|Division|Range|Alert recipient"
    timeout: 30000
- takeScreenshot: villager-onboard-form

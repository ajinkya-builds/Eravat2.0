name: Deploy Production App & APK

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eravat-app/package-lock.json

      - name: Install dependencies
        working-directory: eravat-app
        run: npm ci

      - name: Typecheck
        working-directory: eravat-app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        working-directory: eravat-app
        run: npm run test:run

      - name: Build Web App for GitHub Pages
        working-directory: eravat-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /Eravat2.0/
        run: npm run build

      - name: Deploy Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: eravat-app/dist

      # Capacitor WebView loads from https://localhost/ — GH Pages base (/Eravat2.0/)
      # must NOT be used here or the APK white-screens (asset 404s).
      - name: Build Web App for Android (base /)
        working-directory: eravat-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: eravat-app
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — release APK will be skipped; debug APK still built."
            echo "HAS_RELEASE_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > eravat-app/android/release.jks
          cat > eravat-app/android/keystore.properties <<EOF
          storeFile=$(pwd)/eravat-app/android/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          # Strip accidental leading spaces from heredoc indentation
          sed -i 's/^[[:space:]]*//' eravat-app/android/keystore.properties
          echo "HAS_RELEASE_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        working-directory: eravat-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Android Debug APK
        working-directory: eravat-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android Release APK Artifact
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Eravat-Production-Release-APK
          path: eravat-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eravat-Production-APK
          path: eravat-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload to Appetize.io (Production)
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          APK="eravat-app/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="eravat-app/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ -n "$APPETIZE_API_TOKEN" ]; then
            echo "Uploading APK to Appetize.io ($APK)..."
            response=$(curl -s https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps \
              -F "file=@$APK" \
              -F "platform=android" \
              -F "publicKey=x3fpn3cbi2lc4py3epnl467ica")
            
            publicKey=$(echo $response | jq -r '.publicKey')
            
            if [ "$publicKey" != "null" ] && [ -n "$publicKey" ]; then
              echo "Appetize.io upload successful!"
              echo "Appetize Public Key: $publicKey"
              echo "Appetize URL: https://appetize.io/app/$publicKey"
              echo "### Production Android Emulator" >> $GITHUB_STEP_SUMMARY
              echo "Run the production app directly in your browser here: [Launch Emulator](https://appetize.io/app/$publicKey)" >> $GITHUB_STEP_SUMMARY
            else
              echo "Appetize upload failed: $response"
            fi
          else
            echo "APPETIZE_API_TOKEN secret is not set. Skipping Appetize.io upload."
          fi

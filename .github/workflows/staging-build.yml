name: Build Staging App & APK

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eravat-app/package-lock.json

      - name: Install dependencies
        working-directory: eravat-app
        run: npm ci

      - name: Typecheck
        working-directory: eravat-app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        working-directory: eravat-app
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run test:run

      - name: Resolve staging version
        id: ver
        working-directory: eravat-app
        run: |
          NAME=$(node -p "require('./version.json').versionName")
          CODE=$(node -p "require('./version.json').versionCode")
          node <<'NODE'
          const fs = require('fs');
          const v = require('./version.json');
          const body = (v.changes || []).join('\n');
          // Trailing newline required so the GITHUB_OUTPUT delimiter is on its own line.
          fs.writeFileSync('release-notes.txt', body.endsWith('\n') ? body : `${body}\n`);
          NODE
          {
            echo "version_code=${CODE}"
            echo "version_name=${NAME}"
            echo "release_notes<<ERAVAT_RELNOTES"
            cat release-notes.txt
            echo "ERAVAT_RELNOTES"
          } >> "$GITHUB_OUTPUT"
          echo "Staging version $NAME ($CODE)"
          cat version.json

      - name: Build Web App (Staging env, Android base /)
        working-directory: eravat-app
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGE_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGE_VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /
          VITE_APP_ENV: staging
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.STAGE_VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.STAGE_VITE_POSTHOG_HOST }}
          VITE_APP_VERSION: ${{ steps.ver.outputs.version_name }}
          VITE_APP_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VITE_DISABLE_PWA: 'true'
          VITE_UPDATE_MANIFEST_URL: https://ttjtyvxfiqhjdngkgdkf.supabase.co/storage/v1/object/public/app-updates/staging/latest.json
        run: npm run build -- --mode staging

      - name: Sync Capacitor Android
        working-directory: eravat-app
        run: npx cap sync android

      # Debug keystores are generated per CI runner. Publishing those APKs makes
      # Settings → Update fail with "App not installed" (signature mismatch).
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required so staging APKs share one signing cert."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > eravat-app/android/release.jks
          cat > eravat-app/android/keystore.properties <<EOF
          storeFile=$(pwd)/eravat-app/android/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          sed -i 's/^[[:space:]]*//' eravat-app/android/keystore.properties

      - name: Build Android Release APK
        working-directory: eravat-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.ver.outputs.version_code }} \
            -PversionName=${{ steps.ver.outputs.version_name }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eravat-Staging-APK
          path: eravat-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publish APK for in-app updates
        working-directory: eravat-app
        env:
          STAGE_SUPABASE_URL: ${{ secrets.STAGE_VITE_SUPABASE_URL }}
          STAGE_SUPABASE_SERVICE_ROLE: ${{ secrets.STAGE_SUPABASE_SERVICE_ROLE }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          RELEASE_NOTES: ${{ steps.ver.outputs.release_notes }}
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        run: |
          if [ -z "$STAGE_SUPABASE_SERVICE_ROLE" ]; then
            echo "::warning::STAGE_SUPABASE_SERVICE_ROLE secret is not set — in-app Update will not see this build."
            echo "Add the staging Supabase service_role key as STAGE_SUPABASE_SERVICE_ROLE."
            exit 0
          fi
          node scripts/publish-staging-apk.mjs
          echo "### In-app update published" >> "$GITHUB_STEP_SUMMARY"
          echo "version \`${{ steps.ver.outputs.version_name }}\` (code ${{ steps.ver.outputs.version_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changes:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ver.outputs.release_notes }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest: \`$STAGE_SUPABASE_URL/storage/v1/object/public/app-updates/staging/latest.json\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Appetize.io (Staging)
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -n "$APPETIZE_API_TOKEN" ]; then
            echo "Uploading APK to Appetize.io..."
            response=$(curl -s https://$APPETIZE_API_TOKEN@api.appetize.io/v1/apps \
              -F "file=@eravat-app/android/app/build/outputs/apk/release/app-release.apk" \
              -F "platform=android")
            
            publicKey=$(echo $response | jq -r '.publicKey')
            
            if [ "$publicKey" != "null" ] && [ -n "$publicKey" ]; then
              echo "Appetize.io upload successful!"
              echo "Appetize Public Key: $publicKey"
              echo "Appetize URL: https://appetize.io/app/$publicKey"
              echo "### Staging Android Emulator 📱" >> $GITHUB_STEP_SUMMARY
              echo "Run the staging app directly in your browser here: [Launch Emulator](https://appetize.io/app/$publicKey)" >> $GITHUB_STEP_SUMMARY
            else
              echo "Appetize upload failed: $response"
            fi
          else
            echo "APPETIZE_API_TOKEN secret is not set. Skipping Appetize.io upload."
          fi

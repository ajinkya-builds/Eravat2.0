name: Nightly database backup

# Dumps are uploaded as GitHub Actions artifacts (not committed to git).
# Download from the workflow run: Actions → Nightly database backup → Artifacts.
# Retention: 30 days, then GitHub deletes them.

on:
  schedule:
    # 18:30 UTC = 00:00 IST
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which database to dump
        type: choice
        options:
          - both
          - production
          - staging
        default: both

jobs:
  backup-production:
    name: backup-production
    if: ${{ github.event_name == 'schedule' || inputs.target == 'both' || inputs.target == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repo secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Missing repo secret SUPABASE_DB_PASSWORD (production database password)"
            exit 1
          fi
          mkdir -p backups
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          supabase link --yes --project-ref mnytrlcmdpkfhrzrtesf --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked -f "backups/prod-${STAMP}-schema.sql"
          supabase db dump --linked --data-only --use-copy -f "backups/prod-${STAMP}-data.sql"
          supabase db dump --linked --data-only --use-copy --schema auth -f "backups/prod-${STAMP}-auth.sql"
          gzip backups/*.sql
          ls -lh backups/

      - name: Upload production backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: eravat-prod-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30

  backup-staging:
    name: backup-staging
    if: ${{ github.event_name == 'schedule' || inputs.target == 'both' || inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump staging database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing repo secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Missing repo secret SUPABASE_STAGING_DB_PASSWORD (staging database password)"
            exit 1
          fi
          mkdir -p backups
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          supabase link --yes --project-ref ttjtyvxfiqhjdngkgdkf --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked -f "backups/staging-${STAMP}-schema.sql"
          supabase db dump --linked --data-only --use-copy -f "backups/staging-${STAMP}-data.sql"
          supabase db dump --linked --data-only --use-copy --schema auth -f "backups/staging-${STAMP}-auth.sql"
          gzip backups/*.sql
          ls -lh backups/

      - name: Upload staging backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: eravat-staging-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
